services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ALLOW_LIVE_RUNS: "false"
      AGENTBREAK_DB_PATH: "/data/agentbreak.db"
      FRONTEND_DIST: "/app/frontend/dist"
    volumes:
      - agentbreak-data:/data

volumes:
  agentbreak-data:
