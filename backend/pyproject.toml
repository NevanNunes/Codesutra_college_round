[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbreak"
version = "0.1.0"
description = "AgentBreak contract-first, health-only application scaffold"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
live = [
    "anthropic>=0.39,<1",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
]

[project.scripts]
agentbreak = "agentbreak.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentbreak", "agentbreak.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
